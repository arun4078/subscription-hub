version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brightloop_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://brightloop_user:brightloop_secret@db:5432/brightloop_sms
      - REDIS_URL=redis://cache:6379
      - VITE_SUPABASE_URL=http://localhost:54321
      - VITE_SUPABASE_ANON_KEY=local_dev_anon_key
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: brightloop_postgres
    environment:
      POSTGRES_USER: brightloop_user
      POSTGRES_PASSWORD: brightloop_secret
      POSTGRES_DB: brightloop_sms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop_user -d brightloop_sms"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: brightloop_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
